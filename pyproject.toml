[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decepticonx-py-rust"
version = "0.1.0"
description = "R-free DECEPTICONx orchestration with h5ad input and optional Python/Rust deconvolution backends"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "decepticonX-py-rust contributors" }]
keywords = ["deconvolution", "single-cell", "bulk-rna-seq", "h5ad", "rust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata>=0.10,<0.13",
  "h5py>=3.9",
  "numpy>=1.24",
  "pandas>=1.5",
  "scipy>=1.10",
]

[project.optional-dependencies]
test = ["build>=1.2", "pytest>=8", "pytest-cov>=5"]

[project.scripts]
decepticonx = "decepticonx.cli:main"

[project.urls]
Repository = "https://github.com/LCGaoZzz/decepticonX-py-rust"
Issues = "https://github.com/LCGaoZzz/decepticonX-py-rust/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
